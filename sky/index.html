<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sky — Day-Night Atmosphere</title>
<style>
	:root { color-scheme: dark; }
	* { margin: 0; padding: 0; box-sizing: border-box; }
	html, body { height: 100%; overflow: hidden; background: #04070d; }
	body { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
	canvas { display: block; }

	#hud {
		position: fixed; left: 14px; bottom: 12px; z-index: 5;
		font-size: 11px; line-height: 1.7; color: #b9c8dc;
		text-shadow: 0 1px 3px rgba(0,0,0,.7); pointer-events: none;
		white-space: nowrap;
	}
	#title {
		position: fixed; left: 14px; top: 12px; z-index: 5; pointer-events: none;
		color: #e6edf6; text-shadow: 0 1px 4px rgba(0,0,0,.6);
	}
	#title h1 { font-size: 14px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
	#title p { font-size: 11px; color: #8b9cb4; margin-top: 3px; }
	#title a { color: #a9c4e8; text-decoration: none; }

	#overlay {
		position: fixed; inset: 0; z-index: 10; display: none;
		place-content: center; text-align: center; gap: 10px;
		background: rgba(4, 7, 13, .94); color: #d3ddeb; padding: 40px;
	}
	#overlay h1 { font-size: 18px; letter-spacing: .08em; }
	#overlay p { font-size: 12px; line-height: 1.8; color: #93a5bd; max-width: 640px; }

	/* translucent glass debug panel */
	.lil-gui {
		--background-color: rgba(9, 14, 24, 0.42);
		--title-background-color: rgba(12, 19, 32, 0.5);
		--widget-color: rgba(255, 255, 255, 0.09);
		--hover-color: rgba(255, 255, 255, 0.16);
		--focus-color: rgba(255, 255, 255, 0.22);
		--number-color: #93b8e8;
		--text-color: #d6e0ee;
		--title-text-color: #e8eef8;
	}
	.lil-gui.root { backdrop-filter: blur(14px) saturate(1.1); -webkit-backdrop-filter: blur(14px) saturate(1.1); }
	.lil-gui.root > .children { background: transparent; }
</style>
</head>
<body>
<template id="app-layout">

<div id="title">
	<h1>Sky</h1>
	<p>day-night atmosphere · sun · moon · stars · <a href="../index.html">world-building</a></p>
	<p>drag the hour slider, or let it cycle</p>
</div>
<div id="hud">booting…</div>
<div id="overlay"></div>

<script type="importmap">
{
	"imports": {
		"three": "../vendor/three.webgpu.min.js",
		"three/webgpu": "../vendor/three.webgpu.min.js",
		"three/tsl": "../vendor/three.tsl.min.js",
		"lil-gui": "../vendor/lil-gui.esm.min.js"
	}
}
</script>
</template>
<div id="root"></div>
<script type="module" src="/src/sky.jsx"></script>

</body>
</html>
